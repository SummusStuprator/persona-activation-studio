name: Release checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      STUDIO_HOME: ${{ runner.temp }}/studio-state
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install build
      - run: python -m build
      - run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',*glob.glob('dist/*.whl')])"
      - run: studio init
        working-directory: ${{ runner.temp }}
      - run: studio check
        working-directory: ${{ runner.temp }}
      - run: studio demo
        working-directory: ${{ runner.temp }}
      - run: studio seal
        working-directory: ${{ runner.temp }}
      - run: studio verify
        working-directory: ${{ runner.temp }}
  native-cpu:
    runs-on: ubuntu-latest
    env:
      STUDIO_HOME: ${{ runner.temp }}/studio-native
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install build "cmake>=3.24"
      - run: python -m build --wheel
      - run: python -c "import glob,subprocess,sys; subprocess.check_call([sys.executable,'-m','pip','install',*glob.glob('dist/*.whl')])"
      - run: studio native --jobs 2
        working-directory: ${{ runner.temp }}
      - run: studio doctor --require core --require native
        working-directory: ${{ runner.temp }}
